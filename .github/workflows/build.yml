name: Windows-Installer bauen

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      obs_version:
        description: 'OBS-Version (leer = neueste)'
        required: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OBS_VERSION: ${{ inputs.obs_version || vars.OBS_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: OBS Studio laden (Aufnahme-Motor)
        shell: pwsh
        run: ./scripts/fetch-obs.ps1
      - run: npm test
      - name: Integrationstest mit echtem OBS
        id: integration
        continue-on-error: true
        run: node scripts/obs-integration.js
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Clipper-Setup
          path: dist/*.exe
      - name: Release (bei Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
